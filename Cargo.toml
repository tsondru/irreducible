[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.6.5"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["tsondru", "Claude <noreply@anthropic.com>"]

[workspace.dependencies]
catgraph = { git = "https://github.com/tsondru/catgraph", tag = "v0.13.0" }
catgraph-applied = { git = "https://github.com/tsondru/catgraph", tag = "v0.13.0" }
catgraph-physics = { git = "https://github.com/tsondru/catgraph", tag = "v0.13.0" }
catgraph-surreal = { git = "https://github.com/tsondru/catgraph-surreal", tag = "v0.11.1" }
deep_causality_topology = "0.5.1"
deep_causality_tensor = "0.4.2"
deep_causality_sparse = "0.1.7"
rust_decimal = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "3.0.5", default-features = false }
tokio = { version = "1", features = ["full"] }

[package]
name = "irreducible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Computational irreducibility library based on Gorard's functorial perspective"
repository = "https://github.com/tsondru/irreducible"
homepage = "https://github.com/tsondru/irreducible"
keywords = ["irreducibility", "functor", "computation", "cobordism", "multiway"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
manifold-curvature = ["dc-geometry", "dep:nalgebra"]
lapack = ["dep:nalgebra-lapack", "manifold-curvature"]
dec = ["dc-geometry", "dep:nalgebra"]
dc-geometry = ["dep:deep_causality_topology", "dep:deep_causality_tensor", "dep:deep_causality_sparse"]
persist = ["dep:catgraph-surreal", "dep:surrealdb", "dep:tokio"]

[dependencies]
catgraph.workspace = true
catgraph-applied.workspace = true
catgraph-physics.workspace = true
rust_decimal.workspace = true
nalgebra = { version = "0.34", optional = true }
nalgebra-lapack = { version = "0.27", optional = true, default-features = false, features = ["lapack-openblas"] }
deep_causality_topology = { workspace = true, optional = true }
deep_causality_tensor = { workspace = true, optional = true }
deep_causality_sparse = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
catgraph-surreal = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"

# ---------------------------------------------------------------------------
# Local development override (uncomment in lock-step cross-repo edits)
# ---------------------------------------------------------------------------
# Point the catgraph deps at a local checkout so the catgraph workspace + this
# crate can be edited in lock-step before an upstream umbrella tag is cut.
# Re-comment + revert to git tags before pushing — released artifacts must
# reference the workspace umbrella git tag.
#
# IMPORTANT (H.4 dual-SHA prevention): all THREE catgraph deps must be patched
# together — patching only catgraph + catgraph-physics while leaving
# catgraph-applied resolving from the git tag would split the source identity
# of the catgraph URL (path-patched vs git-tagged) and reproduce the H.4
# boundary-type mismatch on `Cospan<u32>` / `Span<u32>`. Same single-tag-string
# convention as in the live `[workspace.dependencies]` block above.
#
# [patch."https://github.com/tsondru/catgraph"]
# catgraph = { path = "../catgraph/catgraph" }
# catgraph-applied = { path = "../catgraph/catgraph-applied" }
# catgraph-physics = { path = "../catgraph/catgraph-physics" }
#
# [patch."https://github.com/tsondru/catgraph-surreal"]
# catgraph-surreal = { path = "../catgraph-surreal" }
