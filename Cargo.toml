[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.8.0"
edition = "2024"
# Measured cross-feature maximum of the dependencies' declared
# `rust-version`s (`cargo +<v> check --workspace --all-targets --locked
# --ignore-rust-version` per feature lane, which lifts this crate's own
# declaration): the default lane resolves on 1.90; the `persist` lanes need
# 1.94 (catgraph-surreal, fastnum); `dc-geometry` and everything above it
# need 1.98 (deep_causality_*). Re-measure whenever a dependency moves.
rust-version = "1.98"
license = "MIT"
authors = ["tsondru", "Claude <noreply@anthropic.com>"]

[workspace.dependencies]
# Reboot lineage (sustia-llc, public, HTTPS). ONE tag string shared by all
# three — see the dual-SHA note on the [patch] block below. catgraph-surreal
# resolves catgraph from the same git URL and pins the same tag (`v0.23.0`);
# the two tag strings must move together, or the one URL resolves at two SHAs
# and `Cospan<u32>` acquires two incompatible identities.
catgraph = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.23.0" }
catgraph-applied = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.23.0" }
catgraph-physics = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.23.0" }
# The `persist` feature stores hypergraph evolution cospan chains in SurrealDB.
# `default-features = false` drops the store's default `rocksdb` engine, so the
# engine is chosen by `persist-mem` / `persist-rocksdb`.
catgraph-surreal = { git = "https://github.com/sustia-llc/catgraph-surreal", tag = "v0.2.0", default-features = false }
# The `dc-geometry` substrate: Regge curvature, DEC operators, and the sparse
# matrices the Hodge star stack is built from.
deep_causality_topology = "0.10"
deep_causality_tensor = "0.5"
deep_causality_linear = "0.1"
rust_decimal = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Already resolved in Cargo.lock through catgraph; pinned to that version so
# declaring it directly adds no package to the lock.
union-find = "0.4.4"

[package]
name = "irreducible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Computational irreducibility library based on Gorard's functorial perspective"
repository = "https://github.com/tsondru/irreducible"
homepage = "https://github.com/tsondru/irreducible"
keywords = ["irreducibility", "functor", "computation", "cobordism", "multiway"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
manifold-curvature = ["dc-geometry", "dep:nalgebra"]
lapack = ["dep:nalgebra-lapack", "manifold-curvature"]
dec = ["dc-geometry", "dep:nalgebra"]
dc-geometry = ["dep:deep_causality_topology", "dep:deep_causality_tensor", "dep:deep_causality_linear"]
# `persist` brings in the store and the persistence module; it selects no
# engine, so it alone cannot open a connection. `persist-mem` and
# `persist-rocksdb` add one.
persist = ["dep:catgraph-surreal"]
persist-mem = ["persist", "catgraph-surreal/mem"]
persist-rocksdb = ["persist", "catgraph-surreal/rocksdb"]

[dependencies]
catgraph.workspace = true
catgraph-applied.workspace = true
catgraph-physics.workspace = true
catgraph-surreal = { workspace = true, optional = true }
rust_decimal.workspace = true
nalgebra = { version = "0.35", optional = true }
nalgebra-lapack = { version = "0.28", optional = true, default-features = false, features = ["lapack-openblas"] }
deep_causality_topology = { workspace = true, optional = true }
deep_causality_tensor = { workspace = true, optional = true }
deep_causality_linear = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
union-find.workspace = true

[dev-dependencies]
proptest = "1"
# The persistence surface is async. The library itself spawns no runtime and
# takes no tokio dependency; only its tests and example drive one.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "persist_evolution"
required-features = ["persist-mem"]

# ---------------------------------------------------------------------------
# Local development override (uncomment in lock-step cross-repo edits)
# ---------------------------------------------------------------------------
# Point the git deps at local checkouts so upstream + this crate can be edited
# in lock-step before an upstream tag/release is cut. Re-comment + revert to
# git tags before pushing — committed state must never carry a path dep.
#
# IMPORTANT (dual-SHA prevention): all deps sharing one git URL must be patched
# together — patching only catgraph + catgraph-physics while leaving
# catgraph-applied resolving from the git tag would split the source identity
# of the catgraph URL (path-patched vs git-tagged) and reproduce the
# boundary-type mismatch on `Cospan<u32>` / `Span<u32>`. Same single-tag-string
# convention as in the live `[workspace.dependencies]` block above.
#
# [patch."https://github.com/sustia-llc/catgraph"]
# catgraph = { path = "../../sustia-llc/catgraph/catgraph" }
# catgraph-applied = { path = "../../sustia-llc/catgraph/catgraph-applied" }
# catgraph-physics = { path = "../../sustia-llc/catgraph/catgraph-physics" }