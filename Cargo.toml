[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.6.5"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["tsondru", "Claude <noreply@anthropic.com>"]

[workspace.dependencies]
# Reboot lineage (sustia-llc, public, HTTPS). ONE tag string shared by all
# three — see the dual-SHA note on the [patch] block below.
catgraph = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.2.0" }
catgraph-applied = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.2.0" }
catgraph-physics = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.2.0" }
# NOTE: the `persist` feature (catgraph-surreal + surrealdb + tokio) was
# removed pending the catgraph-surreal reboot — the pre-reboot catgraph-surreal
# pins the retired tsondru/catgraph lineage, which is a type-identity mismatch
# with reboot catgraph AND drags two more private git sources into the lock
# (breaking CI fetch). Restore the feature once catgraph-surreal is realigned;
# see the persistence-realignment GitHub issue.
# Pre-release deep_causality (topology 0.6.1 / tensor 0.4.4 / sparse 0.2.0 are
# not on crates.io yet). ONE rev string shared by all three (same dual-SHA
# rationale as catgraph). Swap back to crates.io versions once released.
deep_causality_topology = { git = "https://github.com/deepcausality-rs/deep_causality", rev = "00ba8c0e766033f8658a2a8701402e04aaae8026" }
deep_causality_tensor = { git = "https://github.com/deepcausality-rs/deep_causality", rev = "00ba8c0e766033f8658a2a8701402e04aaae8026" }
deep_causality_sparse = { git = "https://github.com/deepcausality-rs/deep_causality", rev = "00ba8c0e766033f8658a2a8701402e04aaae8026" }
rust_decimal = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "irreducible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Computational irreducibility library based on Gorard's functorial perspective"
repository = "https://github.com/tsondru/irreducible"
homepage = "https://github.com/tsondru/irreducible"
keywords = ["irreducibility", "functor", "computation", "cobordism", "multiway"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
manifold-curvature = ["dc-geometry", "dep:nalgebra"]
lapack = ["dep:nalgebra-lapack", "manifold-curvature"]
dec = ["dc-geometry", "dep:nalgebra"]
dc-geometry = ["dep:deep_causality_topology", "dep:deep_causality_tensor", "dep:deep_causality_sparse"]

[dependencies]
catgraph.workspace = true
catgraph-applied.workspace = true
catgraph-physics.workspace = true
rust_decimal.workspace = true
nalgebra = { version = "0.34", optional = true }
nalgebra-lapack = { version = "0.27", optional = true, default-features = false, features = ["lapack-openblas"] }
deep_causality_topology = { workspace = true, optional = true }
deep_causality_tensor = { workspace = true, optional = true }
deep_causality_sparse = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = "1"

# ---------------------------------------------------------------------------
# Local development override (uncomment in lock-step cross-repo edits)
# ---------------------------------------------------------------------------
# Point the git deps at local checkouts so upstream + this crate can be edited
# in lock-step before an upstream tag/release is cut. Re-comment + revert to
# git tags before pushing — committed state must never carry a path dep.
#
# IMPORTANT (dual-SHA prevention): all deps sharing one git URL must be patched
# together — patching only catgraph + catgraph-physics while leaving
# catgraph-applied resolving from the git tag would split the source identity
# of the catgraph URL (path-patched vs git-tagged) and reproduce the
# boundary-type mismatch on `Cospan<u32>` / `Span<u32>`. Same single-tag-string
# (single-rev-string for deep_causality) convention as in the live
# `[workspace.dependencies]` block above.
#
# [patch."https://github.com/sustia-llc/catgraph"]
# catgraph = { path = "../../sustia-llc/catgraph/catgraph" }
# catgraph-applied = { path = "../../sustia-llc/catgraph/catgraph-applied" }
# catgraph-physics = { path = "../../sustia-llc/catgraph/catgraph-physics" }
#
# [patch."https://github.com/deepcausality-rs/deep_causality"]
# deep_causality_topology = { path = "../../category/deep_causality/deep_causality_topology" }
# deep_causality_tensor = { path = "../../category/deep_causality/deep_causality_tensor" }
# deep_causality_sparse = { path = "../../category/deep_causality/deep_causality_sparse" }