name: ci
# push is filtered to main so PR-branch commits run once (pull_request event
# only); superseded runs on the same ref are cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All git deps resolve over anonymous HTTPS (catgraph went public
# 2026-07-27) — no deploy-key/ssh-agent machinery needed. Cargo.lock is
# committed and CI builds --locked: cargo fetches every git source in the
# lock (even disabled optional deps), so the lock must never carry a git
# source CI cannot fetch.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked --example lattice_gauge
      - run: cargo run --locked --example gorard_demo
      - run: cargo run --locked --example categorical_toolkit
      - run: cargo run --locked --example confluence_corel
      # Feature-matrix leg. `lapack` is excluded: needs libopenblas-dev and adds
      # no logic coverage.
      - run: cargo clippy --workspace --all-targets --locked --features manifold-curvature,dec -- -D warnings
      - run: cargo test --workspace --locked --features manifold-curvature,dec
      # dc-geometry in isolation: the documented `--features dc-geometry`
      # invocation must build without nalgebra (which manifold-curvature and
      # dec both pull in).
      - run: cargo test --workspace --locked --features dc-geometry
      # persist on the in-memory engine; `persist-rocksdb` compiles the same
      # code against a durable engine and is not run here.
      - run: cargo clippy --workspace --all-targets --locked --features persist-mem -- -D warnings
      - run: cargo test --workspace --locked --features persist-mem
      - run: cargo run --locked --example persist_evolution --features persist-mem
